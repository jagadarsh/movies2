<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Protected</title>
</head>
<body style="background:#111;color:white;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;">
  <div style="text-align:center;">
    <h2>Enter Password</h2>
    <input type="password" id="pw" placeholder="Password" style="padding:10px;">
    <br><br>
    <button onclick="check()">Enter</button>
    <p id="msg" style="color:red;"></p>
  </div>

  <script>
    const correct = "moviesaretuff";

    function check() {
      const entered = document.getElementById("pw").value;
      if (entered === correct) {
        window.location.href = "/index.html";
      } else {
        document.getElementById("msg").innerText = "Wrong password.";
      }
    }

    document.getElementById("pw").addEventListener("keypress", function(e){
      if(e.key === "Enter"){ check(); }
    });
  </script>
</body>
</html>

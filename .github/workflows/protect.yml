name: Inject Password Protection

on:
  push:
    branches:
      - production   # runs ONLY when production branch is updated

jobs:
  protect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: production

      - name: Generate auth.html
        run: |
          cat <<EOF > auth.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Protected</title>
          </head>
          <body style="background:#111;color:white;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;">
            <div style="text-align:center;">
              <h2>Enter Password</h2>
              <input type="password" id="pw" placeholder="Password" style="padding:10px;">
              <br><br>
              <button onclick="check()">Enter</button>
              <p id="msg" style="color:red;"></p>
            </div>

            <script>
              const correct = "${{ secrets.SITE_PASSWORD }}";

              function check() {
                const entered = document.getElementById("pw").value;
                if (entered === correct) {
                  window.location.href = "/index.html";
                } else {
                  document.getElementById("msg").innerText = "Wrong password.";
                }
              }

              document.getElementById("pw").addEventListener("keypress", function(e){
                if(e.key === "Enter"){ check(); }
              });
            </script>
          </body>
          </html>
          EOF

      - name: Generate _redirects
        run: echo "/* /auth.html 200" > _redirects

      - name: Commit files back to production
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add auth.html _redirects
          git diff --cached --quiet || git commit -m "Auto inject password protection"
          git push origin production
